# Names the model's runs and its rows in the generations and scores records.
label: u_ed_transformer
backbone:
  kind: transformer
  num_layers: 4
  num_heads: 4
  feedforward_dim: 256
d_model: 64
embeddings:
  activity_dim: 32
  resource_dim: 16
  feature_dim: 8
# Variational dropout: one mask per sequence and site, in training and in generation.
dropout: 0.1
activity_dropout: 0.3
head_hidden_dim: 256
log_variance:
  min: -10.0
  max: 10.0
# Gaussian activity logits, drawn this many times in the loss. null for the plain ablation.
uncertainty:
  categorical_samples: 20
