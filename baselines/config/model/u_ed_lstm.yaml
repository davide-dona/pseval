defaults:
- _sizes
- backbone: lstm
- _self_
_target_: baselines.models.u_ed.UncertaintyAwareEncoderDecoder
# Names the model's runs and its rows in the generations and scores records.
label: u_ed_lstm
# Variational dropout: one mask per sequence and site, in training and, one per suffix, in
# generation.
dropout: 0.1
activity_dropout: 0.3
log_variance:
  min: -10.0
  max: 10.0
# Gaussian activity logits, drawn this many times in the loss.
logit_samples: 20
