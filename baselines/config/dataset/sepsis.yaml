# @package _global_
data:
  name: sepsis
  event_features:
  - DiagnosticArtAstrup
  - DiagnosticBlood
  - DiagnosticECG
  - DiagnosticIC
  - DiagnosticLacticAcid
  - DiagnosticLiquor
  - DiagnosticSputum
  - DiagnosticUrinaryCulture
  - DiagnosticUrinarySediment
  - DiagnosticXthorax
  - DisfuncOrg
  - Hypotensie
  - Hypoxie
  - InfectionSuspected
  - Infusion
  - Oligurie
  - SIRSCritHeartRate
  - SIRSCritLeucos
  - SIRSCritTachypnea
  - SIRSCritTemperature
  - SIRSCriteria2OrMore
  - Age
  - CRP
  - LacticAcid
  - Leucocytes
  - ts_start
  - day_sin
  - day_cos
  - seconds_sin
  - seconds_cos
  log_scaled_features:
  - CRP
  - LacticAcid
  - Leucocytes
  - ts_start
  log_scaled_target_inter_event_time: false
# The training regime of this dataset, over the defaults of train.yaml.
optimizer:
  lr: 0.0003
  warmup_steps: 150
training:
  max_steps: 6000
  val_every_n_steps: 120
  validation_pairs: 10000
  validation_prefixes: 2000
early_stopping:
  patience_validations: 10
dataloader:
  batch_size: 256
