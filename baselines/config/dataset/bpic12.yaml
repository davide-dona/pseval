# @package _global_
data:
  name: bpic12
  event_features:
  - (case) AMOUNT_REQ
  - ts_start
  - day_sin
  - day_cos
  - seconds_sin
  - seconds_cos
  log_scaled_features:
  - (case) AMOUNT_REQ
  - ts_start
# The training regime of this dataset, over the defaults of train.yaml.
optimizer:
  lr: 0.0003
training:
  validation_pairs: 10000
  validation_prefixes: 1000
dataloader:
  batch_size: 128
