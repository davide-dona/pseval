# @package _global_
data:
  name: bpic17
  event_features:
  - case:LoanGoal
  - case:ApplicationType
  - case:RequestedAmount
  - Action
  - EventOrigin
  - lifecycle:transition
  - FirstWithdrawalAmount
  - NumberOfTerms
  - Accepted
  - MonthlyCost
  - Selected
  - CreditScore
  - OfferedAmount
  - ts_start
  - day_sin
  - day_cos
  - seconds_sin
  - seconds_cos
  log_scaled_features:
  - case:RequestedAmount
  - FirstWithdrawalAmount
  - MonthlyCost
  - OfferedAmount
  - ts_start
# The training regime of this dataset, over the defaults of train.yaml.
optimizer:
  lr: 0.0006
training:
  validation_pairs: 50000
  validation_prefixes: 4096
dataloader:
  batch_size: 2048
