[project]
name = "pseval"
version = "1.0.0"
description = "Evaluation protocol for probabilistic suffix prediction in predictive process monitoring"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "declarray @ git+https://github.com/davide-dona/declarray@40e3d1bcac54f8fcf0e69ad5831ed38dd1f67111",
    "huggingface-hub>=1.27.0",
    "numpy>=2.5.1",
    "pandas>=3.0.5",
    "pyarrow>=25.0.0",
    "pysiglib>=4.0.0",
    "pysiglib[cuda]>=4.0.0 ; sys_platform == 'linux'",
    "rapidfuzz>=3.14.5",
    "scipy>=1.18.0",
    "torch>=2.13.0",
    "tqdm>=4.69.1",
]

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pre-commit>=4.6.1",
    "ruff>=0.16.1",
]
baselines = [
    "hydra-core>=1.3.6",
    "omegaconf>=2.3.1",
    "wandb>=0.29.0",
]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # bugbear
    "N",   # pep8-naming
]
ignore = [
    "N812",  # `torch.nn.functional as F` is the standard PyTorch idiom
]

[tool.ruff.lint.isort]
known-first-party = ["pseval", "baselines", "scripts"]

[tool.ruff.format]
quote-style = "single"
